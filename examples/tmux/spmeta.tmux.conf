# Add this to ~/.tmux.conf, or save it as ~/.config/tmux/spmeta.tmux.conf and
# load it with: source-file ~/.config/tmux/spmeta.tmux.conf
#
# Shows "Artist - Title" with a state icon, refreshed every 5 seconds. The
# segment is empty when nothing plays.

set -g status-interval 5
set -g status-right-length 80
set -g status-right '#(spmeta --template "{state_icon} {artist} - {title}" 2>/dev/null)'
