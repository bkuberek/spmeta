    <text x="90" y="290" fill="#F1F2EB" font-size="112" font-weight="500" letter-spacing="-7">spmeta</text>
    <text x="96" y="354" fill="#F1F2EB" font-size="28" letter-spacing="-1">Now playing. Ready to pipe.</text>
  </g>

