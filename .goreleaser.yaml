# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: spmeta

before:
  hooks:
    # Completion scripts and the man page, generated from internal/reference.
    - go run ./internal/docgen -version {{ .Version }} -date {{ .CommitDate }} dist-extras

builds:
  - id: spmeta
    main: ./cmd/spmeta
    binary: spmeta
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: dist-extras/completions/*
        dst: completions
        strip_parent: true
      - src: dist-extras/manpages/spmeta.1.gz
        dst: manpages
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  mode: keep-existing

nfpms:
  - package_name: spmeta
    description: Now-playing metadata for Spotify
    homepage: https://github.com/bkuberek/spmeta
    maintainer: "Bastian Kuberek <bastian@bkuberek.com>"
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: dist-extras/completions/spmeta.bash
        dst: /usr/share/bash-completion/completions/spmeta
        file_info:
          mode: 0644
      # No zsh directory is on the default fpath of both families: Debian
      # reads vendor-completions, Fedora reads site-functions.
      - src: dist-extras/completions/spmeta.zsh
        dst: /usr/share/zsh/vendor-completions/_spmeta
        packager: deb
        file_info:
          mode: 0644
      - src: dist-extras/completions/spmeta.zsh
        dst: /usr/share/zsh/site-functions/_spmeta
        packager: rpm
        file_info:
          mode: 0644
      - src: dist-extras/completions/spmeta.fish
        dst: /usr/share/fish/vendor_completions.d/spmeta.fish
        file_info:
          mode: 0644
      - src: dist-extras/manpages/spmeta.1.gz
        dst: /usr/share/man/man1/spmeta.1.gz
        file_info:
          mode: 0644

aurs:
  - name: spmeta-bin
    homepage: https://github.com/bkuberek/spmeta
    description: Now-playing metadata for Spotify
    license: MIT
    maintainers:
      - "Bastian Kuberek <bastian@bkuberek.com>"
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/spmeta-bin.git
    # Skip the push, and keep the generated PKGBUILD in dist/, until the AUR
    # key is configured.
    skip_upload: '{{ if not (index .Env "AUR_KEY") }}true{{ end }}'
    provides: [spmeta]
    conflicts: [spmeta]
    commit_author:
      name: Bastian Kuberek
      email: bastian@bkuberek.com
    package: |-
      # binary
      install -Dm755 "./spmeta" "${pkgdir}/usr/bin/spmeta"

      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/spmeta-bin/LICENSE"

      # completions
      install -Dm644 "./completions/spmeta.bash" "${pkgdir}/usr/share/bash-completion/completions/spmeta"
      install -Dm644 "./completions/spmeta.zsh" "${pkgdir}/usr/share/zsh/site-functions/_spmeta"
      install -Dm644 "./completions/spmeta.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/spmeta.fish"

      # man page
      install -Dm644 "./manpages/spmeta.1.gz" "${pkgdir}/usr/share/man/man1/spmeta.1.gz"

nix:
  - name: spmeta
    repository:
      owner: bkuberek
      name: nur-packages
      branch: main
      token: "{{ .Env.NUR_GITHUB_TOKEN }}"
    path: pkgs/spmeta/default.nix
    homepage: https://github.com/bkuberek/spmeta
    description: Now-playing metadata for Spotify
    license: mit
    main_program: spmeta
    # Skip the push, and keep the generated derivation in dist/, until the
    # NUR token is configured.
    skip_upload: '{{ if not (index .Env "NUR_GITHUB_TOKEN") }}true{{ end }}'
    commit_author:
      name: Bastian Kuberek
      email: bastian@bkuberek.com
    extra_install: |-
      installManPage ./manpages/spmeta.1.gz
    post_install: |-
      installShellCompletion ./completions/*

homebrew_casks:
  - name: spmeta
    binaries: [spmeta]
    manpages: [manpages/spmeta.1.gz]
    completions:
      bash: completions/spmeta.bash
      zsh: completions/spmeta.zsh
      fish: completions/spmeta.fish
    repository:
      owner: bkuberek
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/bkuberek/spmeta
    description: Now-playing metadata for Spotify
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/spmeta"]
          end
