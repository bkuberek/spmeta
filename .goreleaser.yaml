# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: spmeta

before:
  hooks:
    # Completion scripts and the man page, generated from internal/reference.
    - go run ./internal/docgen -version {{ .Version }} -date {{ .CommitDate }} dist-extras

builds:
  - id: spmeta
    main: ./cmd/spmeta
    binary: spmeta
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: dist-extras/completions/*
        dst: completions
        strip_parent: true
      - src: dist-extras/manpages/spmeta.1.gz
        dst: manpages
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  mode: keep-existing

nfpms:
  - package_name: spmeta
    description: Now-playing metadata for Spotify
    homepage: https://github.com/bkuberek/spmeta
    maintainer: "Bastian Kuberek <bastian@bkuberek.com>"
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: dist-extras/completions/spmeta.bash
        dst: /usr/share/bash-completion/completions/spmeta
        file_info:
          mode: 0644
      # No zsh directory is on the default fpath of both families: Debian
      # reads vendor-completions, Fedora reads site-functions.
      - src: dist-extras/completions/spmeta.zsh
        dst: /usr/share/zsh/vendor-completions/_spmeta
        packager: deb
        file_info:
          mode: 0644
      - src: dist-extras/completions/spmeta.zsh
        dst: /usr/share/zsh/site-functions/_spmeta
        packager: rpm
        file_info:
          mode: 0644
      - src: dist-extras/completions/spmeta.fish
        dst: /usr/share/fish/vendor_completions.d/spmeta.fish
        file_info:
          mode: 0644
      - src: dist-extras/manpages/spmeta.1.gz
        dst: /usr/share/man/man1/spmeta.1.gz
        file_info:
          mode: 0644

homebrew_casks:
  - name: spmeta
    binaries: [spmeta]
    manpages: [manpages/spmeta.1.gz]
    completions:
      bash: completions/spmeta.bash
      zsh: completions/spmeta.zsh
      fish: completions/spmeta.fish
    repository:
      owner: bkuberek
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/bkuberek/spmeta
    description: Now-playing metadata for Spotify
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/spmeta"]
          end
